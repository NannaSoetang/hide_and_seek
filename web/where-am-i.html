<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where Am I?</title>
    <script type="module" src="/src/lookup/page/WhereAmIPage.js"></script>
  </head>
  <body class="subpage-body">
    <main class="where-page">
      <header class="where-header">
        <a class="subpage-back-link" href="./index.html" aria-label="Back to map">Back to map</a>
        <h1>Where Am I?</h1>
      </header>

      <nav class="where-tabs" aria-label="Choose lookup type">
        <button id="tab-location" class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="panel-location">
          My location
        </button>
        <button id="tab-address" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="panel-address">
          Address
        </button>
      </nav>

      <section id="panel-location" class="tab-panel" role="tabpanel" aria-labelledby="tab-location">
        <button id="find-location-button" class="primary-button" type="button">Find my location</button>
        <p id="location-status" class="status-text" aria-live="polite"></p>
      </section>

      <section id="panel-address" class="tab-panel is-hidden" role="tabpanel" aria-labelledby="tab-address">
        <label class="field-label" for="address-query">Address</label>
        <input id="address-query" class="text-input" type="text" autocomplete="off" placeholder="Search street, number or postal area" />
        <div id="address-results" class="address-results" role="listbox" aria-label="Address suggestions"></div>
        <p id="address-status" class="status-text" aria-live="polite"></p>
      </section>

      <section class="result-card" aria-live="polite">
        <h2>Result</h2>
        <dl class="result-list">
          <div class="result-item">
            <dt>Municipality</dt>
            <dd id="result-municipality">-</dd>
          </div>
          <div class="result-item">
            <dt>Constituency</dt>
            <dd id="result-constituency">-</dd>
          </div>
          <div class="result-item">
            <dt>Postal area</dt>
            <dd id="result-postal-area">-</dd>
          </div>
          <div class="result-item">
            <dt>Parish</dt>
            <dd id="result-parish">-</dd>
          </div>
          <div class="result-item">
            <dt>Address</dt>
            <dd id="result-address">-</dd>
          </div>
          <div class="result-item">
            <dt>Coordinates</dt>
            <dd id="result-coordinates">-</dd>
          </div>
        </dl>
      </section>
    </main>
  </body>
</html>
